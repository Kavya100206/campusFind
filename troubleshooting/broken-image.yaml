apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusfind-broken-image
  namespace: troubleshooting-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusfind-broken-image
  template:
    metadata:
      labels:
        app: campusfind-broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/kavya100206/campusfind-backend:nonexistent-tag
          imagePullPolicy: Always
