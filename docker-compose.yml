services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusfind
      POSTGRES_USER: campusfind
      POSTGRES_PASSWORD: campusfind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://campusfind:campusfind@postgres:5432/campusfind
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
