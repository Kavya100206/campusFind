name: CampusFind CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Scan with Trivy & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend and frontend images
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/Kavya100206/campusFind" \
            -t ghcr.io/kavya100206/campusfind-backend:${{ github.sha }} ./backend

          docker build \
            --label "org.opencontainers.image.source=https://github.com/Kavya100206/campusFind" \
            -t ghcr.io/kavya100206/campusfind-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/kavya100206/campusfind-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/kavya100206/campusfind-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/kavya100206/campusfind-backend:${{ github.sha }}
          docker push ghcr.io/kavya100206/campusfind-frontend:${{ github.sha }}
