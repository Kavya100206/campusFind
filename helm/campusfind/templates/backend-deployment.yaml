apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusfind.fullname" . }}-backend
  labels:
    app: campusfind-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: campusfind-backend
  template:
    metadata:
      labels:
        app: campusfind-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          {{- $tag := .Values.backend.tag | default (and .Values.image .Values.image.tag) | default "latest" }}
          image: "{{ .Values.backend.image }}:{{ $tag }}"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "campusfind.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
