apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusfind.fullname" . }}-backend
  labels:
    app: campusfind-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: campusfind-backend
  template:
    metadata:
      labels:
        app: campusfind-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "campusfind.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.username }}; do
                echo "Waiting for postgres to be ready..."
                sleep 2
              done
              echo "Postgres is ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: backend
          {{- $tag := .Values.backend.tag | default (and .Values.image .Values.image.tag) | default "latest" }}
          image: "{{ .Values.backend.image }}:{{ $tag }}"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "campusfind.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
