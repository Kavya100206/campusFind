apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusfind.fullname" . }}-frontend
  labels:
    app: campusfind-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: campusfind-frontend
  template:
    metadata:
      labels:
        app: campusfind-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        {{- $tag := .Values.frontend.tag | default (and .Values.image .Values.image.tag) | default "latest" }}
        image: "{{ .Values.frontend.image }}:{{ $tag }}"
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
{{ toYaml .Values.resources | indent 10 }}
