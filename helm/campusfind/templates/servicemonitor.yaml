{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "campusfind.fullname" . }}-backend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: campusfind-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
