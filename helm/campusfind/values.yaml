image:
  tag: ""

frontend:
  image: ghcr.io/kavya100206/campusfind-frontend
  tag: ""

backend:
  image: ghcr.io/kavya100206/campusfind-backend
  tag: ""

replicaCount: 2
namespace: campusfind
imagePullSecrets: []

postgres:
  host: campusfind-postgres
  database: campusfind
  username: campusfind
  password: campusfind_dev_password
  persistence:
    storageClassName: ""
    size: 5Gi

ingress:
  enabled: false
  ingressClassName: traefik
  host: localhost

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: true
